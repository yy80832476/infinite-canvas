server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

	# 新增：同源反代到中转，浏览器不再跨域
    location /relay/ {
        proxy_pass https://api.yuontop.dpdns.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.yuontop.dpdns.org;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_buffering off;          # 文本流式响应不缓冲
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50m;     # 图片/视频请求体较大
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
